apiVersion: libvirt.m.crossplane.io/v1beta1
kind: Secret
metadata:
  name: example-volume-encryption-secret
spec:
  forProvider:
    type: volume
    usage: encryption
    description: "Volume encryption secret for sensitive VM disk"
    data:
      volume:
        passphrase:
          name: "encryption-credentials"
          namespace: "default" 
          key: "passphrase"
        format: "luks"
    ephemeral: false
    private: true
  providerConfigRef:
    name: libvirt-provider-config
---
apiVersion: libvirt.m.crossplane.io/v1beta1
kind: Secret
metadata:
  name: example-ceph-auth-secret
spec:
  forProvider:
    type: ceph
    usage: authentication
    description: "Ceph authentication secret for distributed storage"
    data:
      ceph:
        username: "ceph-user"
        key:
          name: "ceph-credentials"
          namespace: "default"
          key: "auth-key"
        monitors:
          - "ceph-mon1:6789"
          - "ceph-mon2:6789" 
          - "ceph-mon3:6789"
    ephemeral: false
    private: true
  providerConfigRef:
    name: libvirt-provider-config
---
apiVersion: libvirt.m.crossplane.io/v1beta1
kind: Secret
metadata:
  name: example-iscsi-auth-secret
spec:
  forProvider:
    type: iscsi
    usage: authentication
    description: "iSCSI CHAP authentication secret"
    data:
      iscsi:
        username: "iscsi-user"
        password:
          name: "iscsi-credentials"
          namespace: "default"
          key: "chap-password"
        target: "iqn.2000-01.com.example:target"
    ephemeral: false
    private: true
  providerConfigRef:
    name: libvirt-provider-config
---
apiVersion: libvirt.m.crossplane.io/v1beta1
kind: Secret
metadata:
  name: example-tls-cert-secret
spec:
  forProvider:
    type: tls
    usage: authentication
    description: "TLS certificate for secure communication"
    data:
      tls:
        certificate:
          name: "tls-credentials"
          namespace: "default" 
          key: "tls.crt"
        privateKey:
          name: "tls-credentials"
          namespace: "default"
          key: "tls.key"
        caCertificate:
          name: "tls-credentials"
          namespace: "default"
          key: "ca.crt"
    ephemeral: false
    private: true
  providerConfigRef:
    name: libvirt-provider-config