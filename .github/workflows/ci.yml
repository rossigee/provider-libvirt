# Standardized CI/CD Template for Crossplane Providers
# Version: 2025-09-26 - Updated for Go 1.25.1
#
# This template implements CI builds and validates ONLY
# - CI: Build validation only (no publishing to avoid tag conflicts)
# - Release: All publishing handled by release-template.yml
#
# Apply this pattern across all providers to eliminate tag conflicts

name: CI

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
    branches:
      - master
      - release-*
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Needed for security scanning uploads
  id-token: write  # Needed for OIDC
  actions: read    # Needed for detecting duplicate actions

env:
  GO_VERSION: '1.25.1'
  GOLANGCI_VERSION: 'latest'
  GOLANGCILINT_VERSION: '2.4.0'
  DOCKER_BUILDX_VERSION: 'v0.11.2'

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Lint
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: make lint

  check-diff:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Check Diff
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          make reviewable
          git diff --exit-code

  unit-tests:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Run Unit Tests
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: make test

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          verbose: true

  security-scan:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Run Go Vulnerability Check
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
        continue-on-error: true

      - name: Fix Gosec SARIF format
        if: always() && hashFiles('gosec-results.sarif') != ''
        run: |
          if [ -f gosec-results.sarif ]; then
            jq '.runs[].results[].locations[].physicalLocation.artifactLocation.uri |= if . == null or . == "" then "." else . end' gosec-results.sarif > gosec-results-fixed.sarif
            mv gosec-results-fixed.sarif gosec-results.sarif
          fi

      - name: Upload Gosec Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # CI ONLY VALIDATES BUILDS - NO PUBLISHING
  build-validation:
    runs-on: ubuntu-24.04
    needs: [lint, check-diff, unit-tests, security-scan]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config gcc libc6-dev

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Validate Build Process
        env:
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          # Validate that all build steps work without publishing
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"

          # Verify libvirt libraries and CGO setup
          pkg-config --exists libvirt || (echo "❌ libvirt not found" && exit 1)
          echo "✅ libvirt development libraries detected"

          # Debug libvirt package config and CGO environment
          echo "🔍 libvirt pkg-config info:"
          pkg-config --cflags --libs libvirt || echo "❌ pkg-config failed"

          echo "🔍 CGO environment:"
          echo "CGO_ENABLED=$CGO_ENABLED"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          # Test CGO compilation with a simple libvirt import
          echo "🔍 Testing CGO libvirt compilation:"
          echo 'package main; import "libvirt.org/go/libvirt"; func main() { var _ *libvirt.Connect }' > /tmp/test_libvirt.go
          go build -v /tmp/test_libvirt.go || (echo "❌ CGO libvirt compilation failed" && exit 1)
          echo "✅ CGO libvirt compilation successful"

          # Initialize build tools
          make build.init
          echo "✅ Build tools initialized"

          # Build binary with verbose output and CGO environment
          export CGO_CFLAGS="$(pkg-config --cflags libvirt)"
          export CGO_LDFLAGS="$(pkg-config --libs libvirt)"
          echo "🔍 CGO build flags:"
          echo "CGO_CFLAGS=$CGO_CFLAGS"
          echo "CGO_LDFLAGS=$CGO_LDFLAGS"

          make build
          echo "✅ Binary build successful"

          # Build Docker image locally (without push)
          make docker.build
          echo "✅ Docker image build successful"

          # Build Crossplane package locally (without push)
          make xpkg.build
          echo "✅ Crossplane package build successful"
          
          # Verify build artifacts exist
          ls -la _output/bin/linux_amd64/provider 2>/dev/null && echo "✅ Provider binary exists" || echo "❌ Provider binary missing"
          ls -la _output/xpkg/linux_amd64/*.xpkg 2>/dev/null && echo "✅ Crossplane package exists" || echo "❌ Crossplane package missing"
          
          echo ""
          echo "🎯 Build validation completed successfully"
          echo "📦 All artifacts can be built successfully"
          echo "🏷️  Publishing will occur only on release tag creation"

# Key Principles for this Template:
# 
# 1. CI BUILDS, RELEASE PUBLISHES
#    - CI workflow: Only validates builds (no registry pushes)
#    - Release workflow: Handles all publishing
#    - Eliminates tag conflicts between workflows
# 
# 2. SINGLE PRIMARY REGISTRY
#    - Primary: ghcr.io/rossigee (consistent across all providers)
#    - Optional: Environment-controlled additional registries
# 
# 3. PARALLEL VALIDATION
#    - All validation jobs run in parallel after noop detection
#    - Build validation only runs on master branch
# 
# 4. COMPREHENSIVE SECURITY
#    - govulncheck: Go vulnerability scanning
#    - gosec: Static security analysis
#    - CodeQL integration for SARIF uploads
# 
# 5. STANDARDIZED BUILD SYSTEM
#    - Uses rossigee/build submodule (working fork)
#    - Consistent make targets across all providers
#    - Go 1.24.5 with proper version handling
# 
# To apply this template:
# 1. Copy this structure to .github/workflows/ci.yml
# 2. Update provider-specific names/paths
# 3. Ensure release.yml handles all publishing
# 4. Test with a commit to master (should only validate)
# 5. Test with a version tag (should publish properly)