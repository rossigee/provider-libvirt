name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_ORGS: ghcr.io/rossigee
  GO_REQUIRED_VERSION: 1.26.4

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_REQUIRED_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libvirt development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev

      - name: Vendor Dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run code generation
        run: make generate

      - name: Check go.mod is up to date
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run unit tests
        run: make test

      - name: Run linting
        run: make lint || true

      - name: Build provider binary
        run: |
          mkdir -p _output/bin/linux_amd64
          CGO_ENABLED=1 GOFLAGS="-mod=vendor" VERSION="${{ steps.version.outputs.version }}" \
          go build -mod=vendor -v -o _output/bin/linux_amd64/provider \
            -ldflags "-X github.com/rossigee/provider-libvirt/internal/version.Version=${{ steps.version.outputs.version }}" \
            ./cmd/provider

      - name: Build and push Docker image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cluster/images/provider-libvirt/Dockerfile
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          tags: |
            ${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_ORGS }}/provider-libvirt:latest
          push: true

      - name: Install Crossplane CLI for xpkg build
        run: |
          # Install up CLI - downloads to current dir as 'up'
          curl -fsSL https://cli.upbound.io | sh -s
          # Move to PATH
          mv up /usr/local/bin/
          chmod +x /usr/local/bin/up
          # Install crossplane plugin
          /usr/local/bin/up alpha install crossplane --version 2.3.2

      - name: Build and push xpkg
        run: |
          up alpha xpkg build \
            --package-root=. \
            --package-file=_output/provider-libvirt.xpkg \
            --descriptor-from-image=${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }}
          up alpha xpkg push \
            ${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }} \
            -f _output/provider-libvirt.xpkg

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Provider Image
            Published to: `${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }}`

            ## Crossplane Installation
            ```bash
            kubectl apply -f - <<EOF
            apiVersion: pkg.crossplane.io/v1
            kind: Provider
            metadata:
              name: provider-libvirt
            spec:
              package: ${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }}
            EOF
            ```

            ## Documentation
            See the [README](https://github.com/rossigee/provider-libvirt) for installation and usage instructions.
          draft: false
          prerelease: false

      - name: Verify published artifacts
        run: |
          echo "Verifying published artifacts..."
          docker pull ${{ env.REGISTRY_ORGS }}/provider-libvirt:${{ steps.version.outputs.version }} && echo "✓ Docker image published" || echo "✗ Docker image not found"
          echo "Release complete: ${{ steps.version.outputs.version }}"