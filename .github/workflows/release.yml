name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_ORGS: ghcr.io/rossigee
  GO_REQUIRED_VERSION: 1.27.0

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_REQUIRED_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libvirt development libraries (amd64 + arm64 cross)
        run: |
          # arm64 packages live on ports.ubuntu.com, not the default amd64
          # mirrors, so the existing sources must be restricted to amd64 and
          # a ports source added for arm64 before it can be installed.
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 runners use the DEB822 .sources format, where every
          # stanza defaults to covering all added architectures. Restrict the
          # existing (amd64-only) mirrors explicitly, since arm64 packages
          # live on ports.ubuntu.com, not the main/security archive.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            grep -q '^Architectures:' "$f" || sudo sed -i '/^Types: deb$/a Architectures: amd64' "$f"
          done
          sudo sed -i -E 's/^deb (http|mirror\+file)/deb [arch=amd64] \1/' /etc/apt/sources.list 2>/dev/null || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y libvirt-dev gcc-aarch64-linux-gnu libvirt-dev:arm64

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}

      # The Crossplane runtime image and xpkg package are built and published
      # separately from goreleaser, via the provider's own Makefile (the same
      # build/makelib/xpkg.mk machinery provider-harbor and provider-btcpay use).
      # This ensures the published package is a real xpkg (package.yaml + CRDs +
      # embedded runtime image), not a hand-rolled Docker image missing its CRDs.
      - name: Init build submodule
        run: git submodule update --init --depth 1 build

      - name: Build runtime image
        run: make build BUILD_PLATFORMS="linux_amd64 linux_arm64"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build Crossplane package
        run: make xpkg.build BUILD_PLATFORMS="linux_amd64 linux_arm64"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish runtime image and Crossplane package
        run: |
          make publish \
            REGISTRY_ORGS="ghcr.io/${{ github.repository_owner }}" \
            XPKG_REG_ORGS="ghcr.io/${{ github.repository_owner }}" \
            BRANCH_NAME=master
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Verify published package contains CRDs
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/provider-libvirt:${VERSION}"
          CROSSPLANE_CLI=$(make -s --no-print-directory print.crossplane-cli | tail -1)
          "${CROSSPLANE_CLI}" xpkg extract "${IMAGE}" -o /tmp/verify.gz
          CRD_COUNT=$(gunzip -c /tmp/verify.gz | grep -c '^kind: CustomResourceDefinition' || true)
          echo "Found ${CRD_COUNT} CRDs in published package"
          if [ "${CRD_COUNT}" -lt 8 ]; then
            echo "::error::Published package is missing CRDs (expected 8, found ${CRD_COUNT})"
            exit 1
          fi