version: 2

project_name: provider-libvirt

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: provider-libvirt
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/rossigee/provider-libvirt/internal/version.Version={{.Version}}
    binary: provider
    main: ./cmd/provider
    flags:
      - -mod=vendor
    # CGO needs a matching cross-compiler and target-arch libvirt headers/libs
    # to cross-compile for arm64 from an amd64 runner (installed via
    # dpkg --add-architecture arm64 + apt in the release workflow).
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
          - PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: rossigee
    name: provider-libvirt
  draft: false
  prerelease: auto
  name_template: '{{.Tag}}'
  header: |
    ## Provider Image
    Published to: `ghcr.io/rossigee/provider-libvirt:{{.Version}}`

    ## Crossplane Installation
    ```bash
    kubectl apply -f - <<EOF
    apiVersion: pkg.crossplane.io/v1
    kind: Provider
    metadata:
      name: provider-libvirt
    spec:
      package: ghcr.io/rossigee/provider-libvirt:{{.Version}}
    EOF
    ```

    ## Documentation
    See the [README](https://github.com/rossigee/provider-libvirt) for installation and usage instructions.

# NOTE: the Crossplane runtime image and xpkg package are NOT built by goreleaser.
# They're built and published by `make build` / `make xpkg.build` / `make publish`
# in the release workflow, using the Crossplane CLI's `xpkg build --embed-runtime-image`
# so the published image is a single, correctly-formed xpkg (package.yaml + CRDs +
# embedded runtime image), matching how provider-harbor/provider-btcpay publish.
# A hand-rolled Dockerfile cannot produce that format, which is why the CRDs were
# previously missing from the published package.