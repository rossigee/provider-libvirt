apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-libvirt
  annotations:
    meta.crossplane.io/maintainer: Ross Golder <ross@golder.tech>
    meta.crossplane.io/source: github.com/rossigee/provider-libvirt
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Crossplane provider for managing libvirt/KVM virtual machines and storage resources.
      
      This provider enables declarative management of libvirt domains, networks, 
      storage pools, volumes, and secrets through Kubernetes custom resources.
    meta.crossplane.io/readme: |
      # Provider Libvirt

      `provider-libvirt` is a [Crossplane](https://crossplane.io/) provider that
      enables infrastructure management for [libvirt/KVM](https://libvirt.org/) virtualization.

      ## Available Resource Types

      * **Domain** - Virtual machines with CPU, memory, and disk configuration
      * **Network** - Virtual networks with DHCP and routing configuration  
      * **StoragePool** - Storage pools for VM disk images
      * **Volume** - Storage volumes and disk images
      * **Secret** - Encrypted secrets for authentication

      ## Getting Started

      Install the provider by creating a `Provider` or get started with the [libvirt quickstart](https://github.com/rossigee/provider-libvirt/tree/main/examples).

      ## Report a Bug

      For filing bugs, suggesting improvements, or requesting new features, please
      open an [issue](https://github.com/rossigee/provider-libvirt/issues).
spec:
  controller:
    image: ghcr.io/rossigee/provider-libvirt:v0.7.8