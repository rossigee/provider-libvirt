      type: string
    - jsonPath: .spec.forProvider.type
      name: TYPE
      type: string
    - jsonPath: .spec.forProvider.usage
      name: USAGE
      type: string
    - jsonPath: .status.atProvider.uuid
      name: UUID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
