                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          certificate:
                            description: Certificate in PEM format
                            properties:
                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          certificateChain:
                            description: Certificate chain in PEM format
                            properties:
                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          privateKey:
                            description: Private key in PEM format
                            properties:
                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - certificate
                        type: object
                      volume:
                        description: Volume encryption secrets
                        properties:
                          aesKey:
                            description: AES key for volume encryption (base64 encoded)
                            properties:
                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          format:
                            default: luks
                            description: Format of the encryption (luks, qcow)
                            enum:
                            - luks
                            - qcow
                            type: string
                          passphrase:
                            description: Passphrase for volume encryption
                            properties:
                              key:
                                description: Key within the secret
                                type: string
                              name:
                                description: Name of the Kubernetes secret
                                type: string
                              namespace:
                                description: Namespace of the Kubernetes secret
                                type: string
                            required:
                            - key
                            - name
                            type: object
