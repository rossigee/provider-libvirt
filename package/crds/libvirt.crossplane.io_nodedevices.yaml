kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodedevices.libvirt.crossplane.io
spec:
  group: libvirt.crossplane.io
  names:
    kind: NodeDevice
    listKind: NodeDeviceList
    plural: nodedevices
    singular: nodedevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .spec.forProvider.type
      name: TYPE
      type: string
    - jsonPath: .status.atProvider.state
      name: STATE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A NodeDevice is a libvirt host hardware device for passthrough.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeDeviceSpec defines the desired state of NodeDevice
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: NodeDeviceParameters are the configurable fields of a
                  NodeDevice.
                properties:
                  autostart:
                    default: false
                    description: Autostart device on host boot
                    type: boolean
                  detached:
                    default: false
                    description: Detach device from host driver for passthrough
                    type: boolean
                  driver:
                    description: Driver to use for detached device (e.g., "vfio-pci")
                    type: string
                  managed:
                    default: true
                    description: Device management settings - libvirt manages device
                      lifecycle
                    type: boolean
                  mediatedDevice:
                    description: Mediated device configuration
                    properties:
                      attributes:
                        additionalProperties:
                          type: string
                        description: Attributes for mdev creation
                        type: object
                      parent:
                        description: Parent device name (must be an existing PCI device)
                        type: string
                      type:
                        description: Mediated device type (e.g., "nvidia-63", "i915-GVTg_V5_4")
                        type: string
                      uuid:
                        description: UUID for the mediated device (auto-generated
                          if not specified)
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        type: string
                    required:
                    - parent
                    - type
                    type: object
                  name:
                    description: Device name (auto-discovered or user-specified)
                    type: string
                  pciAddress:
                    description: Device address for PCI devices
                    properties:
                      bus:
                        description: PCI bus
                        pattern: ^0x[0-9a-fA-F]{2}$
                        type: string
                      domain:
                        description: PCI domain (usually 0x0000)
                        pattern: ^0x[0-9a-fA-F]{4}$
                        type: string
                      function:
                        description: PCI function
                        pattern: ^0x[0-9a-fA-F]$
                        type: string
                      slot:
                        description: PCI slot
                        pattern: ^0x[0-9a-fA-F]{2}$
                        type: string
                    required:
                    - bus
                    - domain
                    - function
                    - slot
                    type: object
                  persistent:
                    default: true
                    description: Persistent device definition
                    type: boolean
                  scsiDevice:
                    description: SCSI device identification
                    properties:
                      adapter:
                        description: SCSI adapter name
                        type: string
                      bus:
                        description: SCSI bus
                        format: int32
                        minimum: 0
                        type: integer
                      target:
                        description: SCSI target
                        format: int32
                        minimum: 0
                        type: integer
                      unit:
                        description: SCSI unit/LUN
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - adapter
                    - bus
                    - target
                    - unit
                    type: object
                  type:
                    description: 'Device type: pci, usb, scsi, mdev, net, storage'
                    enum:
                    - pci
                    - usb
                    - scsi
                    - mdev
                    - net
                    - storage
                    type: string
                  usbDevice:
                    description: USB device identification
                    properties:
                      bus:
                        description: USB bus number
                        format: int32
                        maximum: 255
                        minimum: 1
                        type: integer
                      device:
                        description: USB device number
                        format: int32
                        maximum: 127
                        minimum: 1
                        type: integer
                      productId:
                        description: Product ID (hexadecimal)
                        pattern: ^0x[0-9a-fA-F]{4}$
                        type: string
                      vendorId:
                        description: Vendor ID (hexadecimal)
                        pattern: ^0x[0-9a-fA-F]{4}$
                        type: string
                    type: object
                required:
                - type
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: NodeDeviceStatus defines the observed state of NodeDevice
            properties:
              atProvider:
                description: NodeDeviceObservation are the observable fields of a
                  NodeDevice.
                properties:
                  capabilities:
                    description: Device capabilities detected by libvirt
                    items:
                      description: NodeDeviceCapability represents device capability
                        information
                      properties:
                        data:
                          additionalProperties:
                            type: string
                          description: Additional capability-specific data
                          type: object
                        type:
                          description: Capability type (e.g., "pci", "usb", "scsi")
                          type: string
                      required:
                      - type
                      type: object
                    type: array
                  driver:
                    description: Driver currently bound to device
                    type: string
                  iommuGroup:
                    description: IOMMU group information (for PCI devices)
                    properties:
                      devices:
                        description: Other devices in the same IOMMU group
                        items:
                          type: string
                        type: array
                      number:
                        description: IOMMU group number
                        format: int32
                        type: integer
                    required:
                    - number
                    type: object
                  mdevTypes:
                    description: Available mediated device types (for mdev-capable
                      devices)
                    items:
                      description: MdevType represents available mediated device types
                      properties:
                        availableInstances:
                          description: Available instances
                          format: int32
                          type: integer
                        description:
                          description: Description of capabilities
                          type: string
                        deviceApi:
                          description: Device API type
                          type: string
                        id:
                          description: Mediated device type identifier
                          type: string
                        name:
                          description: Human-readable name
                          type: string
                      required:
                      - availableInstances
                      - id
                      - name
                      type: object
                    type: array
                  name:
                    description: Device name as known to libvirt
                    type: string
                  numaNode:
                    description: NUMA node affinity
                    format: int32
                    type: integer
                  parent:
                    description: Parent device (for dependent devices like mdev)
                    type: string
                  product:
                    description: Product information
                    properties:
                      id:
                        description: Product ID (hexadecimal)
                        type: string
                      name:
                        description: Product name/description
                        type: string
                    required:
                    - id
                    - name
                    type: object
                  state:
                    description: 'Device state: active, inactive, detached'
                    type: string
                  sysfsPath:
                    description: Device path in sysfs
                    type: string
                  vendor:
                    description: Vendor information
                    properties:
                      id:
                        description: Vendor ID (hexadecimal)
                        type: string
                      name:
                        description: Vendor name
                        type: string
                    required:
                    - id
                    - name
                    type: object
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
