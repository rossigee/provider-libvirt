---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: domains.libvirt.m.crossplane.io
spec:
  group: libvirt.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - libvirt
    kind: Domain
    listKind: DomainList
    plural: domains
    singular: domain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.state
      name: STATE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: A Domain is a managed resource that represents a libvirt domain
          (VM).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DomainSpec defines the desired state of Domain
            properties:
              forProvider:
                description: DomainParameters are the configurable fields of a Domain.
                properties:
                  arch:
                    default: x86_64
                    description: Architecture
                    type: string
                  autostart:
                    default: false
                    description: Autostart determines if domain starts automatically
                    type: boolean
                  boot:
                    description: Boot devices in order of preference
                    items:
                      type: string
                    type: array
                  console:
                    description: Console configuration for the domain
                    items:
                      description: DomainConsole represents console configuration
                      properties:
                        target:
                          description: Target for console output
                          type: string
                        type:
                          default: pty
                          description: Type of console (e.g., "pty", "tcp")
                          type: string
                      type: object
                    type: array
                  disk:
                    description: Disk devices
                    items:
                      description: DomainDisk represents a disk device
                      properties:
                        bootOrder:
                          description: BootOrder for this disk
                          format: int32
                          type: integer
                        bus:
                          default: virtio
                          description: Bus type (e.g., "virtio", "ide", "scsi")
                          type: string
                        device:
                          description: Device name (e.g., "vda", "vdb")
                          type: string
                        file:
                          description: File path for direct file access (legacy)
                          type: string
                        type:
                          default: virtio
                          description: Type of the disk interface (e.g., "virtio",
                            "ide", "scsi")
                          type: string
                        volumeRef:
                          description: VolumeRef references a Volume resource (for
                            cross-resource references)
                          properties:
                            name:
                              description: Name of the referenced object.
                              type: string
                            policy:
                              description: Policies for referencing.
                              properties:
                                resolution:
                                  default: Required
                                  description: |-
                                    Resolution specifies whether resolution of this reference is required.
                                    The default is 'Required', which means the reconcile will fail if the
                                    reference cannot be resolved. 'Optional' means this reference will be
                                    a no-op if it cannot be resolved.
                                  enum:
                                  - Required
                                  - Optional
                                  type: string
                                resolve:
                                  description: |-
                                    Resolve specifies when this reference should be resolved. The default
                                    is 'IfNotPresent', which will attempt to resolve the reference only when
                                    the corresponding field is not present. Use 'Always' to resolve the
                                    reference on every reconcile.
                                  enum:
                                  - Always
                                  - IfNotPresent
                                  type: string
                              type: object
                          required:
                          - name
                          type: object
                        wwn:
                          description: WWN (World Wide Name) for the disk
                          type: string
                      type: object
                    type: array
                  graphics:
                    description: Graphics configuration for the domain
                    items:
                      description: DomainGraphics represents graphics configuration
                      properties:
                        autoport:
                          description: Autoport automatically assigns port
                          type: boolean
                        listen:
                          description: Listen address for graphics
                          type: string
                        listenAddress:
                          description: ListenAddress for graphics connection (alias
                            for Listen)
                          type: string
                        port:
                          description: Port for graphics connection
                          format: int32
                          type: integer
                        type:
                          default: vnc
                          description: Type of graphics (e.g., "vnc", "spice", "rdp")
                          type: string
                      type: object
                    type: array
                  machine:
                    description: Machine type
                    type: string
                  memory:
                    description: Memory size in bytes
                    format: int64
                    type: integer
                  name:
                    description: Name of the domain
                    type: string
                  networkInterface:
                    description: Network interfaces
                    items:
                      description: DomainNetworkInterface represents a network interface
                      properties:
                        mac:
                          description: MAC address
                          type: string
                        model:
                          default: virtio
                          description: Model type
                          type: string
                        networkName:
                          description: NetworkName for direct network name (legacy)
                          type: string
                        networkRef:
                          description: NetworkRef references a Network resource (for
                            cross-resource references)
                          properties:
                            name:
                              description: Name of the referenced object.
                              type: string
                            policy:
                              description: Policies for referencing.
                              properties:
                                resolution:
                                  default: Required
                                  description: |-
                                    Resolution specifies whether resolution of this reference is required.
                                    The default is 'Required', which means the reconcile will fail if the
                                    reference cannot be resolved. 'Optional' means this reference will be
                                    a no-op if it cannot be resolved.
                                  enum:
                                  - Required
                                  - Optional
                                  type: string
                                resolve:
                                  description: |-
                                    Resolve specifies when this reference should be resolved. The default
                                    is 'IfNotPresent', which will attempt to resolve the reference only when
                                    the corresponding field is not present. Use 'Always' to resolve the
                                    reference on every reconcile.
                                  enum:
                                  - Always
                                  - IfNotPresent
                                  type: string
                              type: object
                          required:
                          - name
                          type: object
                        vlan:
                          description: Vlan VLAN configuration for 802.1q VLAN tagging
                          properties:
                            id:
                              format: int32
                              type: integer
                            nativeMode:
                              type: string
                          required:
                          - id
                          type: object
                        waitForLease:
                          description: WaitForLease waits for IP lease from DHCP
                          type: boolean
                      type: object
                    type: array
                  running:
                    default: true
                    description: Running determines if domain should be running
                    type: boolean
                  type:
                    default: kvm
                    description: Domain type (e.g., "kvm", "qemu")
                    type: string
                  vcpu:
                    description: Number of virtual CPUs
                    format: int32
                    type: integer
                required:
                - memory
                - name
                - vcpu
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: DomainStatus defines the observed state of Domain
            properties:
              atProvider:
                description: DomainObservation are the observable fields of a Domain.
                properties:
                  disks:
                    description: Disks attached to the domain. Empty disk list indicates
                      a potential zombie.
                    items:
                      description: DiskInfo describes a disk device attached to a
                        domain.
                      properties:
                        bootOrder:
                          description: BootOrder is the boot order if configured
                          format: int32
                          type: integer
                        device:
                          description: Device is the target device name (e.g., "sda",
                            "vda")
                          type: string
                        source:
                          description: Source is the disk source (file path, volume
                            name, etc.)
                          type: string
                        type:
                          description: Type is the disk type (e.g., "disk", "cdrom")
                          type: string
                      type: object
                    type: array
                  id:
                    description: ID is the domain ID
                    type: string
                  state:
                    description: State of the domain
                    type: string
                  uuid:
                    description: UUID of the domain
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
